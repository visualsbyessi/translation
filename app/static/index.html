<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ad Voiceover Automation</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="panel">
        <div class="topbar">
          <div>
            <p class="eyebrow">Team voiceover tool</p>
            <h1>Upload an English ad. Download translated MP3 voiceovers.</h1>
          </div>
          <span class="status-pill" id="server-status">Ready</span>
        </div>

        <form id="upload-form" class="uploader">
          <label class="dropzone" for="video">
            <input id="video" name="video" type="file" accept="video/*" required />
            <span class="drop-icon">↑</span>
            <strong id="file-label">Choose video file</strong>
            <small>MP4, MOV, or other common ad video formats</small>
          </label>

          <fieldset class="language-grid">
            <legend>Voiceover languages</legend>
            <label><input type="checkbox" name="language_choice" value="de" checked /><span>German MP3</span></label>
            <label><input type="checkbox" name="language_choice" value="fr" /><span>French MP3</span></label>
            <label><input type="checkbox" name="language_choice" value="es" /><span>Spanish MP3</span></label>
            <label><input type="checkbox" name="language_choice" value="it" /><span>Italian MP3</span></label>
            <label><input type="checkbox" name="language_choice" value="pt" /><span>Portuguese MP3</span></label>
            <label><input type="checkbox" name="language_choice" value="nl" /><span>Dutch MP3</span></label>
            <input type="hidden" name="languages" id="languages" value="de" />
          </fieldset>

          <fieldset class="mode-grid">
            <legend>Translation mode</legend>
            <label>
              <input type="radio" name="translation_mode" value="broll" checked />
              <span><strong>B-roll Sync</strong><small>Best visual matching, more time and credits</small></span>
            </label>
            <label>
              <input type="radio" name="translation_mode" value="tight" />
              <span><strong>Tight Pacing</strong><small>Less silence, still uses B-roll analysis</small></span>
            </label>
            <label>
              <input type="radio" name="translation_mode" value="fast" />
              <span><strong>Fast/Cheap</strong><small>Skips B-roll analysis, lower cost</small></span>
            </label>
          </fieldset>

          <label class="script-box">
            <span>Approved script</span>
            <textarea name="approved_script" rows="8" placeholder="Paste your clean script here. Use your client's product name and remove competitor claims or product names. The automation will adapt this to fit the original timing."></textarea>
          </label>

          <label class="script-box">
            <span>Words or product names to avoid</span>
            <input type="text" name="banned_terms" placeholder="Competitor brand, old product name, words to remove" />
          </label>

          <button class="primary" type="submit">Generate voiceovers</button>
        </form>

        <section class="progress" id="progress" hidden>
          <div class="progress-row">
            <strong id="progress-title">Processing</strong>
            <span id="progress-state">Queued</span>
          </div>
          <div class="bar"><span id="bar-fill"></span></div>
          <p id="progress-message">Upload received.</p>
        </section>

        <section class="result" id="result" hidden>
          <h2>MP3 files are ready</h2>
          <ul id="file-list"></ul>
          <a class="download" id="download-link" href="#">Download voiceovers</a>
        </section>
      </section>

    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
